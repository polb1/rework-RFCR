name: Update RFEF matches

on:
  schedule:
    - cron: '0 1 * * *'   # 03:00 hora local Espanya (01:00 UTC hivern, 03:00 estiu)
  workflow_dispatch:       # permet execució manual des de GitHub UI

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch RFEF matches
        run: node scripts/fetch-rfef.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain src/data/matches.json)" ]]; then
            git config user.name "rfcr-bot"
            git config user.email "bot@reusfcreddis"
            git add src/data/matches.json
            git commit -m "chore(data): actualització automàtica calendari RFEF"
            git push
          else
            echo "Res per commitejar"
          fi
