name: Update RFEF matches

on:
  schedule:
    # La RFEF publica horaris de Segona Federació els DILLUNS ~12 dies abans de cada jornada.
    # Estratègia: capturar el mateix dilluns a la tarda + resta de dies matinada.
    - cron: '0 12 * * 1'      # Dilluns 14:00 hora Espanya (estiu) — captura publicació RFEF
    - cron: '0 1 * * 0,2-6'   # Dimarts-Diumenge 03:00 hora Espanya — correccions + resultats
  workflow_dispatch:           # permet execució manual des de GitHub UI

concurrency:
  group: update-matches
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pdftotext
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Fetch RFEF matches
        run: node scripts/fetch-rfef.mjs

      - name: Commit if changed
        run: |
          if [[ -n "$(git status --porcelain src/data/matches.json)" ]]; then
            git config user.name "rfcr-bot"
            git config user.email "bot@reusfcreddis"
            git add src/data/matches.json
            git commit -m "chore(data): actualització automàtica calendari RFEF"
            git push
          else
            echo "Res per commitejar"
          fi
